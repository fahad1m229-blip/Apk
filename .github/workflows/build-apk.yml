name: Build debug APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q jarvis-android-project.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle -p jarvis :app:assembleDebug --no-daemon
      - run: |
          mkdir -p APK_DOWNLOAD
          cp jarvis/app/build/outputs/apk/debug/app-debug.apk APK_DOWNLOAD/app-debug.apk
          test "$(stat -c%s APK_DOWNLOAD/app-debug.apk)" -gt 1048576
      - uses: actions/upload-artifact@v4
        with: { name: app-debug-apk, path: APK_DOWNLOAD/app-debug.apk }
